stages:
  - build
  - test
  - sonarqube
  - package
  - docker
  - security
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  APP_DIR: "app/product-service"

cache:
  paths:
    - .m2/repository/

maven-clean:
  stage: build
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - echo "Stage 1 - Maven Clean"
    - cd app/product-service && mvn clean
  only:
    - main

maven-validate:
  stage: build
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - echo "Stage 2 - Maven Validate"
    - cd app/product-service && mvn validate
  only:
    - main

maven-compile:
  stage: build
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - echo "Stage 3 - Compiling Java Code"
    - cd app/product-service && mvn compile
  artifacts:
    paths:
      - app/product-service/target/classes/
    expire_in: 1 hour
  only:
    - main

maven-test:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - echo "Stage 4 - Running Unit Tests"
    - cd app/product-service && mvn test
  artifacts:
    when: always
    reports:
      junit: app/product-service/target/surefire-reports/TEST-*.xml
    paths:
      - app/product-service/target/surefire-reports/
    expire_in: 1 week
  only:
    - main

sonarqube-analysis:
  stage: sonarqube
  image: maven:3.9.5-eclipse-temurin-17
  cache:
    key: maven-sonar-cache
    paths:
      - .m2/repository/
  script:
    - echo "===== SonarCloud Analysis ====="
    - cd app/product-service
    - mvn sonar:sonar
        -Dsonar.projectKey=$SONAR_PROJECT_KEY
        -Dsonar.organization=$SONAR_ORG_KEY
        -Dsonar.host.url=https://sonarcloud.io
        -Dsonar.login=$SONAR_TOKEN
    - echo "===== SonarCloud Analysis Complete! ====="
  only:
    - main

maven-package:
  stage: package
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - echo "Stage 5 - Creating JAR file"
    - cd app/product-service && mvn package -DskipTests
    - ls -la target/*.jar
  artifacts:
    paths:
      - app/product-service/target/*.jar
    expire_in: 1 hour
  only:
    - main

docker-build-push:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "Stage 6 - Docker Login"
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN
  script:
    - echo "Building Docker Image"
    - cd app/product-service
    - docker build -t $DOCKERHUB_USERNAME/product-service:$CI_COMMIT_SHORT_SHA .
    - docker tag $DOCKERHUB_USERNAME/product-service:$CI_COMMIT_SHORT_SHA $DOCKERHUB_USERNAME/product-service:gitlab-latest
    - echo "Pushing to DockerHub"
    - docker push $DOCKERHUB_USERNAME/product-service:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKERHUB_USERNAME/product-service:gitlab-latest
  only:
    - main

trivy-scan:
  stage: security
  image: aquasec/trivy:latest
  variables:
    TRIVY_NO_PROGRESS: 'true'
    TRIVY_CACHE_DIR: '.trivycache'
    TMPDIR: '/tmp'
  cache:
    key: trivy-db-cache
    paths:
      - .trivycache/
  script:
    - echo "===== Trivy Security Scan ====="

    - trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress --scanners vuln --cache-dir $TRIVY_CACHE_DIR --format table $DOCKERHUB_USERNAME/product-service:$CI_COMMIT_SHORT_SHA
    
    - echo "===== Trivy Scan PASSED! Image is secure! ====="
    
    - trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --scanners vuln --cache-dir $TRIVY_CACHE_DIR --format json --output trivy-report.json $DOCKERHUB_USERNAME/product-service:$CI_COMMIT_SHORT_SHA || true

artifacts:
    name: trivy-security-report
    when: always
    paths:
      - trivy-report.json
    expire_in: 30 days
  only:
    - main

deploy-to-ec2:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - cat "$EC2_SSH_KEY" > ~/.ssh/id_rsa
    - echo "" >> ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@$EC2_HOST "
        docker pull $DOCKERHUB_USERNAME/product-service:gitlab-latest &&
        docker stop product-service-gl || true &&
        docker rm product-service-gl || true &&
        docker run -d --name product-service-gl -p 8083:8081 --restart unless-stopped $DOCKERHUB_USERNAME/product-service:gitlab-latest &&
        sleep 60 &&
        curl -f http://localhost:8083/actuator/health &&
        echo GitLab-CI-Deploy-Success"
  only:
    - main

pipeline-summary:
  stage: deploy
  image: alpine:latest
  script:
    - echo "================================"
    - echo "GitLab CI Pipeline Complete!"
    - echo "Commit $CI_COMMIT_SHORT_SHA"
    - echo "Branch $CI_COMMIT_BRANCH"
    - echo "================================"
  needs:
    - deploy-to-ec2
  only:
    - main
