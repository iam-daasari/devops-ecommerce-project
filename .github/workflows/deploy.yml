name: CI/CD Pipeline → GitHub Actions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────
  # JOB 1: Test
  # ─────────────────────────
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven Clean
        run: mvn clean
        working-directory: app/product-service

      - name: Maven Validate
        run: mvn validate
        working-directory: app/product-service

      - name: Maven Compile
        run: mvn compile
        working-directory: app/product-service

      - name: Maven Test
        run: mvn test
        working-directory: app/product-service

      - name: Maven Package
        run: mvn package -DskipTests
        working-directory: app/product-service

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-service-jar
          path: app/product-service/target/*.jar

  # ─────────────────────────
  # JOB 2: Docker Build Push
  # ─────────────────────────
  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }} \
            app/product-service/
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/product-service:github-latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service:github-latest

  # ─────────────────────────
  # JOB 3: Deploy to AWS EC2
  # ─────────────────────────
  deploy:
    name: Deploy to AWS EC2
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/product-service:github-latest

            # Stop old container
            docker stop product-service-gh || true
            docker rm product-service-gh || true

            # Run new container
            docker run -d \
              --name product-service-gh \
              -p 8082:8081 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/product-service:github-latest

            # Health check
            sleep 20
            curl -f http://localhost:8082/actuator/health && echo "GitHub Actions Deploy Success!"

  # ─────────────────────────
  # JOB 4: Notify
  # ─────────────────────────
  notify:
    name: Pipeline Summary
    needs: deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Success Summary
        run: |
          echo "================================"
          echo "GitHub Actions Pipeline Complete"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "================================"
