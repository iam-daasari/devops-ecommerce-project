apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopease-deployment
  namespace: shopease
  labels:
    app: shopease
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopease
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: shopease
    spec:
      containers:
        - name: shopease
          image: iamdaasari27/product-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: shopease-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
