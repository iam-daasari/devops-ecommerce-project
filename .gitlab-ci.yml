# .gitlab-ci.yml
# GitLab CI/CD Pipeline for E-Commerce Product Service

stages:
  - build
  - test
  - package
  - docker
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE/product-service
  APP_DIR: app/product-service

# Cache Maven dependencies
cache:
  paths:
    - .m2/repository/

# ─────────────────────────────────────
# STAGE 1: CLEAN
# ─────────────────────────────────────
maven-clean:
  stage: build
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - echo "===== Stage 1: Maven Clean ====="
    - cd $APP_DIR
    - mvn clean
  only:
    - main
    - merge_requests

# ─────────────────────────────────────
# STAGE 2: VALIDATE
# ─────────────────────────────────────
maven-validate:
  stage: build
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - echo "===== Stage 2: Maven Validate ====="
    - cd $APP_DIR
    - mvn validate
  only:
    - main
    - merge_requests

# ─────────────────────────────────────
# STAGE 3: COMPILE
# ─────────────────────────────────────
maven-compile:
  stage: build
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - echo "===== Stage 3: Compiling Java Code ====="
    - cd $APP_DIR
    - mvn compile
  artifacts:
    paths:
      - app/product-service/target/classes/
    expire_in: 1 hour
  only:
    - main
    - merge_requests

# ─────────────────────────────────────
# STAGE 4: TEST
# ─────────────────────────────────────
maven-test:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - echo "===== Stage 4: Running Unit Tests ====="
    - cd $APP_DIR
    - mvn test
  artifacts:
    when: always
    reports:
      junit: app/product-service/target/surefire-reports/TEST-*.xml
    paths:
      - app/product-service/target/surefire-reports/
    expire_in: 1 week
  only:
    - main
    - merge_requests

# ─────────────────────────────────────
# STAGE 5: PACKAGE
# ─────────────────────────────────────
maven-package:
  stage: package
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - echo "===== Stage 5: Creating JAR file ====="
    - cd $APP_DIR
    - mvn package -DskipTests
    - echo "JAR created successfully!"
    - ls -la target/*.jar
  artifacts:
    paths:
      - app/product-service/target/*.jar
    expire_in: 1 hour
  only:
    - main

# ─────────────────────────────────────
# STAGE 6: DOCKER BUILD AND PUSH
# ─────────────────────────────────────
docker-build-push:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "===== Stage 6: Docker Login ====="
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN
  script:
    - echo "===== Building Docker Image ====="
    - cd app/product-service
    - docker build -t $DOCKERHUB_USERNAME/product-service:$CI_COMMIT_SHORT_SHA .
    - docker tag $DOCKERHUB_USERNAME/product-service:$CI_COMMIT_SHORT_SHA
              $DOCKERHUB_USERNAME/product-service:gitlab-latest
    - echo "===== Pushing to DockerHub ====="
    - docker push $DOCKERHUB_USERNAME/product-service:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKERHUB_USERNAME/product-service:gitlab-latest
    - echo "Docker image pushed successfully!"
  only:
    - main

# ─────────────────────────────────────
# STAGE 7: DEPLOY TO AWS EC2
# ─────────────────────────────────────
deploy-to-ec2:
  stage: deploy
  image: alpine:latest
  before_script:
    - echo "===== Installing SSH client ====="
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
  script:
    - echo "===== Stage 7: Deploying to AWS EC2 ====="
    - ssh -i ~/.ssh/id_rsa ubuntu@$EC2_HOST "
        docker pull $DOCKERHUB_USERNAME/product-service:gitlab-latest &&
        docker stop product-service-gl || true &&
        docker rm product-service-gl || true &&
        docker run -d
          --name product-service-gl
          -p 8083:8081
          --restart unless-stopped
          $DOCKERHUB_USERNAME/product-service:gitlab-latest &&
        sleep 20 &&
        curl -f http://localhost:8083/actuator/health &&
        echo 'GitLab CI Deploy Success!'
      "
  environment:
    name: production
    url: http://$EC2_HOST:8083
  only:
    - main

# ─────────────────────────────────────
# PIPELINE SUMMARY
# ─────────────────────────────────────
pipeline-summary:
  stage: deploy
  image: alpine:latest
  script:
    - echo "================================"
    - echo "GitLab CI Pipeline Complete!"
    - echo "Commit - $CI_COMMIT_SHORT_SHA"
    - echo "Branch - $CI_COMMIT_BRANCH"
    - echo "Triggered by - $GITLAB_USER_NAME"
    - echo "Pipeline ID - $CI_PIPELINE_ID"
    - echo "================================"
  only:
    - main
  needs:
    - deploy-to-ec2
